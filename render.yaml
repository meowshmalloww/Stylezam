services:
  - type: web
    name: stylezam-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /v1/health
    maxShutdownDelaySeconds: 60
    disk:
      name: stylezam-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: STYLEZAM_ENVIRONMENT
        value: production
      - key: STYLEZAM_DATA_DIR
        value: /data
      - key: STYLEZAM_API_TOKEN
        sync: false
      - key: STYLEZAM_PUBLIC_BASE_URL
        sync: false
      - key: STYLEZAM_SERPAPI_API_KEY
        sync: false
      - key: STYLEZAM_EBAY_CLIENT_ID
        sync: false
      - key: STYLEZAM_EBAY_CLIENT_SECRET
        sync: false
      - key: STYLEZAM_YOUCAM_API_KEY
        sync: false
      - key: STYLEZAM_OLLAMA_ENABLED
        value: "false"
      - key: STYLEZAM_LOCAL_VISION_ENABLED
        value: "false"
